<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lyzer 的个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
            padding: 2rem;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .tagline {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 3rem;
        }

        .section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .section h2 {
            font-size: 1.1rem;
            color: #58a6ff;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .note-list { list-style: none; margin-top: 0.5rem; }
        .note-item { padding: 0.75rem 1rem; background: #0d1117; border: 1px solid #21262d; border-radius: 6px; margin-bottom: 0.5rem; transition: border-color 0.2s; }
        .note-item:hover { border-color: #58a6ff; }
        .note-item a { color: #c9d1d9; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .note-item a:hover { color: #58a6ff; }
        .note-tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #1f6feb22; color: #58a6ff; }

        .code-placeholder {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: #0d1117;
            border: 1px dashed #30363d;
            border-radius: 6px;
            margin-top: 0.75rem;
            color: #484f58;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">🚀</div>
        <h1 class="tagline">网站用于学习内容经验分享</h1>
        <p class="subtitle">记录学习过程，分享技术经验</p>

        <div class="section">
            <h2>💻 代码项目</h2>
            <p>这里将展示我的代码作品和项目，敬请期待。</p>
            <div class="code-placeholder">
                <span>⚙️</span>
                <span>项目筹备中…</span>
            </div>
        </div>

        <div class="section">
            <h2>📒 学习笔记</h2>
            <p>记录学习过程中的技术总结与心得。</p>
            <ul class="note-list">
                <li class="note-item">
                    <a href="StudyNotes/Self-attention.pdf">📄 Self-attention <span class="note-tag">笔记</span></a>
                </li>
                <li class="note-item">
                    <a href="StudyNotes/TransformerLearning.html">📓 Transformer Learning <span class="note-tag">笔记</span></a>
                </li>
            </ul>
        </div>

        <footer>© 2026 lyzer · Powered by GitHub Pages</footer>
    </div>
</body>
</html>
