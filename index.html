<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lyzer 的个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #24292f;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            width: 100%;
            padding: 2rem;
        }

        .tagline {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #6e7781;
            margin-bottom: 3rem;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: #0969da;
            text-decoration: none;
            font-size: 1.15rem;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #6e7781;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="tagline">网站用于学习内容经验分享</h1>
        <p class="subtitle">记录学习过程，分享技术经验</p>

        <nav class="nav-links">
            <a href="projects.html">代码项目</a>
            <a href="notes.html">学习笔记</a>
        </nav>

        <footer>
            © 2026 lyzer · Powered by GitHub Pages
            <div class="update-date">页面更改日期：<span id="update-date">2026-08-31</span></div>
        </footer>
    </div>

    <script>
        // 自动显示页面文件最后修改日期
        var el = document.getElementById('update-date');
        var lm = new Date(document.lastModified);
        if (el && !isNaN(lm.getTime())) {
            var y = lm.getFullYear();
            var m = ('0' + (lm.getMonth() + 1)).slice(-2);
            var d = ('0' + lm.getDate()).slice(-2);
            el.textContent = y + '-' + m + '-' + d;
        }
    </script>
</body>
</html>
